}

.leading-none{
  line-height: 1;
}

.leading-relaxed{
  line-height: 1.625;
}

.leading-tight{
  line-height: 1.25;
}

.tracking-tight{
  letter-spacing: -0.025em;
}

.tracking-wider{
  letter-spacing: 0.05em;
}

.text-white{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

.accent-\[\#2ee47f\]{
  accent-color: #2ee47f;
}

.opacity-70{
  opacity: 0.7;
}

.outline{
  outline-style: solid;
}

.blur{

  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);

.transition-all{

:root{
  --bg:#0a0f0d;
  --surface:#121916;

  --amber:#ffb224;
  --amber-soft:rgba(255,178,36,.14);
  --red:#ff5d5d;
  --red-soft:rgba(255,93,93,.14);

}

@media (prefers-color-scheme: light){
  :root{
    --bg:#eef3ef;
    --surface:#ffffff;
    --surface-2:#f2f7f2;

    --text:#122016;
    --muted:#52685a;
    --muted-2:#718878;
    --primary:#0f9d58;
    --primary-dark:#087a43;
    --primary-soft:rgba(15,157,88,.11);
    --amber:#c67d00;
    --amber-soft:rgba(198,125,0,.11);
    --red:#d93b3b;
    --red-soft:rgba(217,59,59,.10);
    --blue:#1879c8;
  }
}

[data-tema="escuro"]{

  --surface:#121916;

}

[data-tema="claro"]{
  --bg:#eef3ef;
  --surface:#ffffff;

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif
}

.font-display{
  font-family:'Sora',system-ui,sans-serif
}

input,select,textarea,button{
  font:inherit
}

input[type="month"],input[type="date"],input[type="text"],input[type="number"],input[type="search"],select,textarea{
  background:var(--surface-2);
  border:1px solid var(--line);
  color:var(--text);
  border-radius:12px;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft)
}

::-moz-selection{
  background:var(--primary);
  color:#06130b
}

::selection{
  background:var(--primary);
  color:#06130b
}

::-webkit-scrollbar{
  width:10px;
  height:10px
}

::-webkit-scrollbar-thumb{
  background:#355043;
  border-radius:20px
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

@media (min-width: 640px){
  .sm\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .sm\:inline{
    display: inline;
  }

    flex: none;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:p-5{

  }

  .sm\:p-6{

  }

  .sm\:px-6{

  }

  .sm\:text-\[28px\]{
    font-size: 28px;
  }

  .sm\:text-\[30px\]{
    font-size: 30px;
  }
}

@media (min-width: 1024px){
  .lg\:col-span-1{
    grid-column: span 1 / span 1;
  }

  .lg\:col-span-2{
    grid-column: span 2 / span 2;
  }

  .lg\:col-span-3{

  }

    grid-template-columns: repeat(5, minmax(0, 1fr));
  }
}
